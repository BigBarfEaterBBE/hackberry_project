<!DOCTYPE html>
<html>
<head>
    <title>Web Face Recognition</title>
    <meta name = "viewport" content = "width=device-width,initial-scale = 1">
</head>
<body>
    <h1>Webcam Recognition (iPhone Camera)</h1>
    <div class = "controls">
        <button id="startButton">Start Camera & Recognition</button>
        <button id = "stopButton">Stop</button>
    </div>
    <div id = "status">Status: Stopped</div>

    <div id = "video-container">
        <video id = "video" autoplay playsinline style = "display: none"></video>
        <canvas id="frameCanvas" style = "display:none"></canvas>
        <img id = "processedFrame" style = "width: 100%; max-width: 640px;"/>
    </div>
    <script>
        const startButton = document.getElementById("startButton");
        const stopButton = document.getElementById("stopButton");
        const statusDiv = document.getElementById("status");
        const video = document.getElementById("video");
        const canvas = document.getElementById("frameCanvas")
        const processedFrame = document.getElementById("processedFrame");
        const context = canvas.getContext('2d')
        const processRoute = "{{ url_for('process_frame') }}";
        const TARGET_WIDTH = 320;
        const JPEG_QUALITY = 0.7;
        let stream;
        let isRunning = false;
        let processingInterval =null;
        const FPS = 10;
        let frameDelay = 1000/FPS;

        async function startRecognition() {
            try{
                //1 access cam using MediaDevices API
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "user"}, //use "environment" for back facing camera
                    audio: false
                });
                video.srcObject = stream;
                // wait for video metadata to load
                video.onloadedmetadata = () => {
                    canvas.width = TARGET_WIDTH;
                    canvas.height = (video.videoHeight / video.videoWidth) * TARGET_WIDTH;
                    video.play()
                    isRunning = true;
                    requestAnimationFrame(sendFrameToServer)
                    startButton.disabled = true;
                    stopButton.disabled = false;
                    statusDiv.textContent = "Status: Running...";
                }
            } catch (err) {
                //ERROR HANDLING
                console.error("Error accessing media devices: ", err);
                if (err.name === "NotAllowedError" || err.name === "PermissionDeniedError") {
                    statusDiv.textContent = "Status: Camera access was denied. Please check your browser settings.";
                } else if (err.name === "NotFoundError") {
                    statusDiv.textContent = "Status: No camerafound on this device.";
                } else{
                    statusDiv.textContent = "Status: Camera error or not supported.";
                }
                startButton.disabled = false;
            }
        }
        function stopRecognition() {
            isRunning = false;
            clearInterval(processingInterval);
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }
            video.srcObject = null;
            processedFrame.src = "";
            startButton.disabled = false;
            stopButton.disabled = true;
            statusDiv.textContent = "Status: Stopped";
        }

        function sendFrameToServer() {
            if (!isRunning) return;
            context.drawImage(video, 0,0, canvas.width, canvas.height);
            const imageData = canvas.toDataURL('image/jpeg', JPEG_QUALITY)
            fetch('/process_frame', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ image: imageData})
            })
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    console.error("Server Error:", data.error);
                } else {
                    processedFrame.src = 'data:image/jpeg;base64,' + data.processed_image;
                }
                requestAnimationFrame(sendFrameToServer)
            })
            .catch(error => {
                console.error('Network or Fetch error:', error)
                requestAnimationFrame(sendFrameToServer)
            });
        }
        startButton.addEventListener("click", startRecognition);
        stopButton.addEventListener("click", stopRecognition);
    </script>
</body>
</html>
