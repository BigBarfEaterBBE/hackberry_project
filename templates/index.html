<!DOCTYPE html>
<html>
<head>
    <title>Web Face Recognition</title>
    <meta name = "viewport" content = "width=device-width,initial-scale = 1">
</head>
<body>
    <h1>Webcam Recognition (iPhone Camera)</h1>
    <div class = "controls">
        <button id="startButton">Start Camera & Recognition</button>
        <button id = "stopButton">Stop</button>
    </div>
    <div id = "status">Status: Stopped</div>

    <div id = "video-container">
        <video id = "videoElement" autoplay playsinline></video>
        <img id = "processedImage" style = "width: 100%; max-width: 640px;"/>
    </div>
    <script>
        const startButton = document.getElementById("startButton");
        const stopButton = document.getElementById("stopButton");
        const statusDiv = document.getElementById("status");
        const videoElement = document.getElementById("videoElement");
        const processedImage = document.getElementById("processedImage");
        const processRoute = "{{ url_for('process_frame') }}";
        let streaml = null;
        let processingInterval =null;
        const FPS = 10;
        let frameDelay = 1000/FPS;

        async function startRecognition() {
            try{
                //1 access cam using MediaDevices API
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "user"}, //use "environment" for back facing camera
                    audio: false
                });
                videoElement.srcObject = stream;
                // wait for video metadata to load
                await new Promise(resolve => videoElement.onloadedmetadata = resolve);
                //set display params
                processedImage.width = videoElement.videoWidth;
                processedImage.height = videoElement.videoHeight;

                //2 start frame processing loop
                processingInterval = setInterval(sendFrameToServer, frameDelay);
                //3 Update GUI
                startButton.disabled = true;
                stopButton.disabled = false;
                statusDiv.textContent = "Status: Running...";

            } catch (err) {
                //ERROR HANDLING
                console.error("Error accessing media devices: ", err);
                if (err.name === "NotAllowedError" || err.name === "PermissionDeniedError") {
                    statusDiv.textContent = "Status: Camera access was denied. Please check your browser settings.";
                } else if (err.name === "NotFoundError") {
                    statusDiv.textContent = "Status: No camerafound on this device.";
                } else{
                    statusDiv.textContent = "Status: Camera error or not supported.";
                }
                startButton.disabled = false;
            }
        }
        function sendFrameToServer() {
            const canvas = document.createElement("canvas");
            canvas.width = videoElement.videoWidth;
            canvas.height = videoElement.videoHeight;
            const ctx = canvas.getContext("2d");
            //1 draw current vid frame onto canvas
            ctx.drawImage(videoElement, 0.0, canvas.width, canvas.height);
            //2 get image data as a JPEG Base64 string
            const imageDataURL = canvas.toDataURL("image/jpeg",0.8);
            //3 use fetch API to send data to server
            fetch(processRoute, {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({image: imageDataURL})
            })
            .then(response => response.json())
            .then(data => {
                if (data.processedImage) {
                    //4 update image source w/ processed base64 string
                    processedImage.src = "data:image/jpeg;base64," + data.processedImage;
                }
            })
            .catch(error => {
                //ERROR LOGGING
                statusDiv.textContent = "Status: Network or Server Error. Check terminal.";
                stopRecognition();
            })
        }
    </script>
</body>
</html>
